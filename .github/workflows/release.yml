name: Release

# Publishes (or refreshes) the GitHub release for the version in
# beer/__init__.py whenever the release branch or a v* tag is pushed.
on:
  push:
    branches: [main, "claude/kind-galileo-azb9v0"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          TAG="v$(python3 -c 'import beer; print(beer.__version__)')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Released tags are immutable once published from main; branch pushes refresh them.
          if [ "$GITHUB_REF_NAME" = main ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.exists != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y rpm
      - run: sh scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with: {name: packages, path: dist/*}

  macos-app:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build-macos-app.sh
      - name: Test the app (Apple Silicon)
        run: |
          APP=build/macos/Beer.app
          file $APP/Contents/MacOS/Beer
          $APP/Contents/MacOS/Beer --cli --version
          $APP/Contents/MacOS/Beer --cli doctor || true
          $APP/Contents/Resources/python-arm64/bin/python3 -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"
          codesign --verify --verbose $APP || true
      - name: Test the app (Intel, via Rosetta)
        continue-on-error: true
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 build/macos/Beer.app/Contents/MacOS/Beer --cli --version
          arch -x86_64 build/macos/Beer.app/Contents/Resources/python-x86_64/bin/python3 -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"
      - name: Test the window opens from the disk image
        run: |
          hdiutil attach dist/Beer-macOS.dmg -mountpoint /tmp/beerdmg
          ls -la /tmp/beerdmg
          /tmp/beerdmg/Beer.app/Contents/MacOS/Beer > /tmp/beer-gui.log 2>&1 &
          PID=$!
          sleep 15
          screencapture -x /tmp/beer-macos.png || true
          kill -0 $PID && echo "Window is running"
          kill $PID || true
          cat /tmp/beer-gui.log
          hdiutil detach /tmp/beerdmg
      - uses: actions/upload-artifact@v4
        with: {name: macos, path: dist/Beer-macOS.dmg}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: screenshot-macos, path: /tmp/beer-macos.png}

  appimage:
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y xvfb imagemagick
      - run: sh scripts/build-appimage.sh
      - name: Test the AppImage
        run: |
          IMG="$(ls dist/Beer-*.AppImage)"
          chmod +x "$IMG"
          file "$IMG"
          APPIMAGE_EXTRACT_AND_RUN=1 "$IMG" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$IMG" doctor || true
          xvfb-run -s "-screen 0 1024x700x24" sh -c "
            APPIMAGE_EXTRACT_AND_RUN=1 '$IMG' > /tmp/gui.log 2>&1 &
            PID=\$!; sleep 15
            import -window root /tmp/beer-linux-$(uname -m).png
            kill -0 \$PID && echo 'Window is running'; R=\$?
            kill \$PID; cat /tmp/gui.log; exit \$R"
      - uses: actions/upload-artifact@v4
        with: {name: "appimage-${{ matrix.runner }}", path: dist/Beer-*.AppImage}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "screenshot-${{ matrix.runner }}", path: /tmp/beer-linux-*.png}

  freebsd:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y python3
          run: |
            sh scripts/build-freebsd-pkg.sh
            pkg add dist/beer-*.pkg
            beer --version
            beer install-wine --dry-run
      - uses: actions/upload-artifact@v4
        with: {name: freebsd, path: dist/beer-*.pkg}

  # Checks that x86 Windows programs really run on an ARM Linux computer (via Hangover).
  arm-wine:
    needs: test
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo -E python3 -m beer install-wine
      - name: Run a 32-bit x86 Windows program
        run: |
          sudo apt-get install -y gcc-mingw-w64-i686
          printf '#include <stdio.h>\nint main(void){FILE*f=fopen("ok.txt","w");fputs("hello from windows",f);fclose(f);return 0;}\n' > t.c
          mkdir game && i686-w64-mingw32-gcc t.c -o game/Game.exe
          timeout 900 python3 -m beer run --wait game/Game.exe
          cat game/ok.txt

  release:
    needs: [check, packages, macos-app, appimage, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true, pattern: "{packages,macos,appimage-*,freebsd}"}
      - name: Publish GitHub release
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          cd dist && rm -f SHA256SUMS && sha256sum * > SHA256SUMS && ls -l && cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Point the tag at this commit (the Homebrew formula installs from the tag).
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release edit "$TAG" --title "Beer ${TAG#v}" --notes-file packaging/RELEASE_NOTES.md --latest
            for old in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              [ -e "dist/$old" ] || gh release delete-asset "$TAG" "$old" --yes
            done
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Beer ${TAG#v}" --notes-file packaging/RELEASE_NOTES.md --latest
          fi
