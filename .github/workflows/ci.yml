name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Install with the installer script
        run: sudo sh install.sh --no-deps --no-wine && whiskey --version && whiskey doctor || true

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y python3
          run: |
            python3 -m unittest discover -s tests -v
            sh install.sh --no-deps --no-wine
            whiskey --version
